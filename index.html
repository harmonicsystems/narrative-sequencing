<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narrative Sequencing</title>
<style>
  /* Warm paper palette. Text and edges are checked for contrast; nothing
     relies on colour alone, and there is no pure black or pure white. */
  :root {
    --bg: #f5efe3;         /* cream page */
    --surface: #fdf9f1;    /* card paper */
    --soft: #ebe2d1;       /* beige wells and tray */
    --ink: #3a2f25;        /* body text */
    --muted: #675a4b;      /* secondary text */
    --edge: #8f7f68;       /* outlines of cards, spots, buttons */
    --line: #d9cdb8;       /* decorative rules only */
    --accent: #7a5236;     /* primary brown */
    --accent-ink: #fdf9f1;
    --shadow: 0 1px 2px rgba(70, 48, 24, 0.10), 0 5px 14px rgba(70, 48, 24, 0.07);
    --cw: clamp(96px, 16vw, 172px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2a231d; --surface: #43382e; --soft: #352c25;
      --ink: #efe6d6; --muted: #c2b39d; --edge: #a8977f; --line: #54483c;
      --accent: #d9a878; --accent-ink: #2a231d;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 5px 14px rgba(0, 0, 0, 0.18);
    }
  }
  :root[data-theme="dark"] {
    --bg: #2a231d; --surface: #43382e; --soft: #352c25;
    --ink: #efe6d6; --muted: #c2b39d; --edge: #a8977f; --line: #54483c;
    --accent: #d9a878; --accent-ink: #2a231d;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 5px 14px rgba(0, 0, 0, 0.18);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 18px/1.6 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: 0.01em;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 40px 20px 72px; }
  [hidden] { display: none !important; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 6px; }
  h2 { font-size: 1.05rem; font-weight: 600; margin: 40px 0 12px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 0.9rem; }

  button, select { font: inherit; letter-spacing: inherit; color: inherit; }
  .btn {
    min-height: 52px; padding: 12px 22px; border-radius: 16px;
    border: 1.5px solid var(--edge); background: var(--surface); cursor: pointer;
    transition: background-color 0.15s, box-shadow 0.15s;
  }
  .btn.primary {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
    font-weight: 600; padding-inline: 30px;
  }
  .btn:disabled { opacity: 0.5; cursor: default; }
  /* Chosen option: thicker ring and a tinted fill, so it never depends on hue alone. */
  .btn[aria-pressed="true"] {
    border-color: var(--accent); box-shadow: 0 0 0 2.5px var(--accent);
    background: var(--soft); font-weight: 600;
  }
  .link {
    background: none; border: 0; padding: 10px 4px; min-height: 44px; cursor: pointer;
    color: var(--muted); text-decoration: underline; text-underline-offset: 4px;
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

  /* Setup */
  #storyList { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .story { text-align: left; }
  .story span { display: block; }
  .story .meta { font-size: 0.88rem; font-weight: 400; color: var(--muted); }
  label.check { display: inline-flex; gap: 10px; align-items: center; min-height: 48px; margin-top: 6px; cursor: pointer; }
  label.check input { width: 22px; height: 22px; accent-color: var(--accent); }
  #sessionBar { margin-top: 44px; padding-top: 22px; border-top: 1px solid var(--line); justify-content: space-between; }
  #setupFoot { margin-top: 28px; justify-content: flex-end; }

  /* Play */
  #playHead { justify-content: space-between; margin-bottom: 32px; }
  #slots, #tray { display: flex; flex-wrap: wrap; justify-content: center; gap: 34px 16px; }
  #slots { padding-top: 30px; }
  .slot {
    position: relative; width: var(--cw); aspect-ratio: 3 / 4;
    background: var(--soft); border: 1.5px solid var(--edge); border-radius: 20px;
    transition: background-color 0.15s, box-shadow 0.15s;
  }
  .slot::before {
    content: attr(data-n); position: absolute; top: -30px; left: 0; right: 0;
    text-align: center; font-size: 1rem; font-weight: 600; color: var(--muted);
  }
  .picking .slot:not(.filled) { background: var(--surface); box-shadow: 0 0 0 2.5px var(--accent); }
  #tray {
    margin-top: 40px; padding: 26px 16px; min-height: calc(var(--cw) * 1.34 + 52px);
    background: var(--soft); border-radius: 28px; gap: 16px;
  }
  .card {
    width: var(--cw); aspect-ratio: 3 / 4; display: flex; flex-direction: column;
    background: var(--surface); border: 1.5px solid var(--edge); border-radius: 20px;
    box-shadow: var(--shadow); overflow: hidden; position: relative;
    cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none;
    transition: box-shadow 0.15s, translate 0.15s;
  }
  .slot .card { width: calc(100% + 3px); height: calc(100% + 3px); margin: -1.5px; }
  .card .art {
    flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--cw) * 0.42); line-height: 1;
  }
  .card .art img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  /* Room for two lines on every card, so pictures sit at the same height
     whether a caption wraps or not. */
  .card .cap {
    padding: 6px 8px 10px; font-size: clamp(0.8rem, 1.5vw, 0.95rem); line-height: 1.3; text-align: center;
    min-height: calc(2.6em + 16px); display: flex; align-items: center; justify-content: center;
  }
  .card.plain .art { display: none; }
  .card.plain .cap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: clamp(0.9rem, 1.9vw, 1.15rem); padding: 12px;
  }
  /* Picked-up card: ring plus a small lift. */
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 3.5px var(--accent), var(--shadow); translate: 0 -6px; }
  .card.dragging { z-index: 10; cursor: grabbing; transition: none; box-shadow: 0 14px 30px rgba(50, 34, 16, 0.24); }
  .card.pinned { cursor: default; box-shadow: none; }
  /* The fixed first card is labelled above its spot, never on the picture. */
  .slot.start::before { color: var(--ink); }
  .locked .card { cursor: default; }
  #feedback { min-height: 2.2em; margin: 34px 0 16px; text-align: center; font-size: 1.3rem; }
  #actions { justify-content: center; }
  #cueBox { margin-top: 56px; justify-content: flex-end; font-size: 0.88rem; color: var(--muted); }
  #cueBox select {
    min-height: 44px; padding: 4px 10px; border-radius: 12px;
    border: 1.5px solid var(--edge); background: var(--surface); color: var(--ink);
  }

  /* Summary */
  .box {
    background: var(--surface); border: 1.5px solid var(--edge); border-radius: 16px;
    padding: 18px 20px; margin-bottom: 14px; user-select: text; -webkit-user-select: text;
  }
  pre.box {
    overflow-x: auto; letter-spacing: 0; tab-size: 14;
    font: 0.82rem/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>
<main>

  <section id="setup">
    <h1>Narrative Sequencing</h1>
    <p class="muted">Choose a story for the student to put in order.</p>
    <p class="muted small" id="sourceNote" hidden></p>

    <h2>Which story?</h2>
    <div id="storyList"></div>

    <h2>How should the cards look?</h2>
    <div class="row" id="styleRow"></div>
    <label class="check small"><input type="checkbox" id="captions" checked> Show words under pictures</label>

    <div id="dirBlock" hidden>
      <h2>Which way does it go?</h2>
      <div class="row" id="dirRow"></div>
    </div>

    <div class="row" style="margin-top:36px">
      <button class="btn primary" id="startBtn">Start</button>
    </div>

    <div class="row" id="sessionBar" hidden>
      <span class="muted small" id="sessionCount"></span>
      <button class="btn" id="endFromSetup">End session</button>
    </div>

    <div class="row" id="setupFoot">
      <button class="link small" id="themeBtn"></button>
    </div>
  </section>

  <section id="play" hidden>
    <div class="row" id="playHead">
      <h1 id="playTitle"></h1>
      <button class="link small" id="backBtn">Stories</button>
    </div>
    <div id="slots"></div>
    <div id="tray" aria-label="Cards to place"></div>
    <p id="feedback" role="status" aria-live="polite"></p>
    <div class="row" id="actions">
      <button class="btn primary" id="checkBtn">Check</button>
      <button class="btn primary" id="nextBtn" hidden>Next story</button>
      <button class="btn" id="endBtn" hidden>End session</button>
    </div>
    <div class="row" id="cueBox">
      <label for="cue">Cue</label>
      <select id="cue">
        <option value="independent">independent</option>
        <option value="verbal">verbal</option>
        <option value="visual">visual</option>
        <option value="model">model</option>
      </select>
    </div>
  </section>

  <section id="summary" hidden>
    <h1>Session summary</h1>
    <h2>O-line</h2>
    <div class="box" id="oline"></div>
    <button class="btn primary" id="copyO">Copy</button>

    <h2>Raw data</h2>
    <pre class="box" id="raw"></pre>
    <button class="btn" id="copyRaw">Copy raw data</button>

    <div class="row" style="margin-top:40px">
      <button class="btn" id="resumeBtn">Back to stories</button>
      <button class="link" id="newSession">Start a new session</button>
    </div>
    <p class="muted small" style="margin-top:16px">Nothing is saved. Closing or reloading this page clears the session.</p>
  </section>

</main>

<script>
'use strict';

// Built-in copy of stories.json, used only when the file can't be fetched
// (browsers block fetch when index.html is opened straight from disk).
const SEED = [{"id": "brushing-teeth", "title": "Brushing teeth", "gradeBand": "K-2", "reversible": false, "styles": ["cartoon", "emoji", "text"], "paper": {"cartoon": "#f1ede1"}, "cards": [{"text": "Put toothpaste on the brush", "emoji": "🪥", "img": "01.jpg"}, {"text": "Brush all your teeth", "emoji": "😬", "img": "02.jpg"}, {"text": "Rinse with water", "emoji": "🚰", "img": "03.jpg"}]}, {"id": "planting-a-seed", "title": "Planting a seed", "gradeBand": "K-2", "reversible": false, "styles": ["emoji", "text"], "cards": [{"text": "Dig a hole", "emoji": "🕳️"}, {"text": "Drop in the seed", "emoji": "🌰"}, {"text": "Water the soil", "emoji": "💧"}, {"text": "A sprout comes up", "emoji": "🌱"}]}, {"id": "making-a-sandwich", "title": "Making a sandwich", "gradeBand": "3-5", "reversible": false, "styles": ["emoji", "text"], "cards": [{"text": "Lay out two slices of bread", "emoji": "🍞"}, {"text": "Add cheese and lettuce", "emoji": "🧀"}, {"text": "Put the top slice on", "emoji": "🥪"}, {"text": "Eat the sandwich", "emoji": "😋"}]}, {"id": "mailing-a-letter", "title": "Mailing a letter", "gradeBand": "3-5", "reversible": false, "styles": ["emoji", "text"], "cards": [{"text": "Write the letter", "emoji": "✍️"}, {"text": "Seal it in an envelope", "emoji": "✉️"}, {"text": "Stick on a stamp", "emoji": "🏷️"}, {"text": "Drop it in the mailbox", "emoji": "📮"}, {"text": "The letter arrives", "emoji": "📬"}]}, {"id": "puffer-fish", "title": "Puffer fish", "gradeBand": "K-2", "reversible": true, "endLabels": ["calm", "puffed"], "styles": ["cartoon", "emoji", "text"], "paper": {"cartoon": "#f7f2e7"}, "cards": [{"text": "Small and calm", "emoji": "🐟", "img": "01.jpg"}, {"text": "Half puffed", "emoji": "🐠", "img": "02.jpg"}, {"text": "Fully puffed, spikes out", "emoji": "🐡", "img": "03.jpg"}]}, {"id": "kettle", "title": "Kettle", "gradeBand": "3-5", "reversible": true, "endLabels": ["cold", "boiling"], "styles": ["cartoon", "emoji", "text"], "paper": {"cartoon": "#f1ede1"}, "cards": [{"text": "Cold water, no bubbles", "emoji": "🧊", "img": "01.jpg"}, {"text": "Warm water, tiny bubbles", "emoji": "🌡️", "img": "02.jpg"}, {"text": "Hot water, lots of bubbles", "emoji": "♨️", "img": "03.jpg"}, {"text": "Boiling, steam whistling out", "emoji": "💨", "img": "04.jpg"}]}, {"id": "storm", "title": "Storm", "gradeBand": "3-5", "reversible": true, "endLabels": ["clear", "storm"], "styles": ["cartoon", "emoji", "text"], "cards": [{"text": "Clear blue sky", "emoji": "☀️", "img": "01.jpg"}, {"text": "A few clouds", "emoji": "🌤️", "img": "02.jpg"}, {"text": "Gray clouds cover the sky", "emoji": "☁️", "img": "03.jpg"}, {"text": "Rain is falling", "emoji": "🌧️", "img": "04.jpg"}, {"text": "Thunder and lightning", "emoji": "⛈️", "img": "05.jpg"}]}, {"id": "voice-volume", "title": "Voice volume", "gradeBand": "K-8", "reversible": true, "endLabels": ["silent", "yelling"], "styles": ["cartoon", "emoji", "text"], "paper": {"cartoon": "#f1ede1"}, "cards": [{"text": "Silent, no sound", "emoji": "🔇", "img": "01.jpg"}, {"text": "Whisper", "emoji": "🤫", "img": "02.jpg"}, {"text": "Talking voice", "emoji": "🗣️", "img": "03.jpg"}, {"text": "Loud voice", "emoji": "📣", "img": "04.jpg"}, {"text": "Yelling voice", "emoji": "🔊", "img": "05.jpg"}]}, {"id": "small-to-large", "title": "Small to large", "gradeBand": "K-2", "reversible": true, "endLabels": ["small", "large"], "styles": ["shape", "text"], "paper": {"shape": "#fdf9f1"}, "cards": [{"text": "Tiny", "img": "01.svg"}, {"text": "Small", "img": "02.svg"}, {"text": "Big", "img": "03.svg"}, {"text": "Very big", "img": "04.svg"}]}, {"id": "light-to-dark", "title": "Light to dark", "gradeBand": "K-2", "reversible": true, "endLabels": ["light", "dark"], "styles": ["shape", "text"], "paper": {"shape": "#fdf9f1"}, "cards": [{"text": "Very light", "img": "01.svg"}, {"text": "Light", "img": "02.svg"}, {"text": "Dark", "img": "03.svg"}, {"text": "Very dark", "img": "04.svg"}]}, {"id": "low-to-high", "title": "Low to high", "gradeBand": "K-2", "reversible": true, "endLabels": ["low", "high"], "styles": ["shape", "text"], "paper": {"shape": "#fdf9f1"}, "cards": [{"text": "Low", "img": "01.svg"}, {"text": "In the middle", "img": "02.svg"}, {"text": "High", "img": "03.svg"}]}, {"id": "filling-up", "title": "Filling up", "gradeBand": "K-2", "reversible": true, "endLabels": ["empty", "full"], "styles": ["shape", "text"], "paper": {"shape": "#fdf9f1"}, "cards": [{"text": "None filled", "img": "01.svg"}, {"text": "One filled", "img": "02.svg"}, {"text": "Two filled", "img": "03.svg"}, {"text": "Three filled", "img": "04.svg"}, {"text": "All filled", "img": "05.svg"}]}, {"id": "thin-to-thick", "title": "Thin to thick", "gradeBand": "K-2", "reversible": true, "endLabels": ["thin", "thick"], "styles": ["shape", "text"], "paper": {"shape": "#fdf9f1"}, "cards": [{"text": "Very thin", "img": "01.svg"}, {"text": "Thin", "img": "02.svg"}, {"text": "Thick", "img": "03.svg"}, {"text": "Very thick", "img": "04.svg"}]}, {"id": "few-to-many", "title": "Few to many", "gradeBand": "K-2", "reversible": true, "endLabels": ["few", "many"], "styles": ["shape", "text"], "paper": {"shape": "#fdf9f1"}, "cards": [{"text": "One dot", "img": "01.svg"}, {"text": "Three dots", "img": "02.svg"}, {"text": "Six dots", "img": "03.svg"}, {"text": "Ten dots", "img": "04.svg"}]}, {"id": "left-to-right", "title": "Left to right", "gradeBand": "K-2", "reversible": true, "endLabels": ["left", "right"], "styles": ["shape", "text"], "paper": {"shape": "#fdf9f1"}, "cards": [{"text": "On the left", "img": "01.svg"}, {"text": "In the middle", "img": "02.svg"}, {"text": "On the right", "img": "03.svg"}]}, {"id": "short-to-tall", "title": "Short to tall", "gradeBand": "K-2", "reversible": true, "endLabels": ["short", "tall"], "styles": ["shape", "text"], "paper": {"shape": "#fdf9f1"}, "cards": [{"text": "Very short", "img": "01.svg"}, {"text": "Short", "img": "02.svg"}, {"text": "Tall", "img": "03.svg"}, {"text": "Very tall", "img": "04.svg"}]}];// @seed

const CUES = {
  independent: 'independently',
  verbal: 'with verbal cues',
  visual: 'with visual cues',
  model: 'with a model'
};
const $ = id => document.getElementById(id);

let stories = [];
let log = [];          // one record per checked attempt
let runCount = 0;      // one run = one presentation of a story
let S = null;          // state of the story on screen
const pick = { storyId: null, style: null, direction: 'forward' };

function show(name) {
  for (const id of ['setup', 'play', 'summary']) $(id).hidden = id !== name;
  window.scrollTo(0, 0);
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

/* ---------- Setup ---------- */

function renderSetup() {
  const story = stories.find(s => s.id === pick.storyId) || stories[0];
  pick.storyId = story.id;
  if (!story.styles.includes(pick.style)) pick.style = story.styles[0];

  const list = $('storyList');
  list.replaceChildren();
  for (const s of stories) {
    const b = el('button', 'btn story');
    b.setAttribute('aria-pressed', s.id === story.id);
    b.append(el('span', '', s.title));
    const plays = new Set(log.filter(a => a.storyId === s.id).map(a => a.run)).size;
    const meta = [s.gradeBand, s.cards.length + ' cards'];
    if (s.reversible) meta.push('reversible');
    if (plays) meta.push('done' + (plays > 1 ? ' ×' + plays : ''));
    b.append(el('span', 'meta', meta.filter(Boolean).join(' · ')));
    b.onclick = () => { pick.storyId = s.id; renderSetup(); };
    list.append(b);
  }

  const styleRow = $('styleRow');
  styleRow.replaceChildren();
  for (const st of story.styles) {
    const b = el('button', 'btn', st);
    b.setAttribute('aria-pressed', st === pick.style);
    b.onclick = () => { pick.style = st; renderSetup(); };
    styleRow.append(b);
  }

  $('dirBlock').hidden = !story.reversible;
  if (story.reversible) {
    const [a, z] = story.endLabels || ['start', 'end'];
    const dirRow = $('dirRow');
    dirRow.replaceChildren();
    for (const [dir, label] of [['forward', a + ' → ' + z], ['reverse', z + ' → ' + a]]) {
      const b = el('button', 'btn', label);
      b.setAttribute('aria-pressed', dir === pick.direction);
      b.onclick = () => { pick.direction = dir; renderSetup(); };
      dirRow.append(b);
    }
  }

  const runs = new Set(log.map(a => a.run)).size;
  $('sessionBar').hidden = !runs;
  $('sessionCount').textContent = runs + (runs === 1 ? ' story' : ' stories') + ' logged this session';
}

/* ---------- Play ---------- */

function shuffledAwayFrom(target) {
  const a = [...target];
  if (a.length < 2) return a;
  do {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
  } while (a.every((c, i) => c === target[i]));
  return a;
}

function pad2(n) { return String(n).padStart(2, '0'); }

function buildCard(story, idx, style, captions) {
  const data = story.cards[idx];
  const card = el('div', 'card');
  card.tabIndex = 0;
  card.setAttribute('role', 'button');
  card.setAttribute('aria-label', data.text);
  const art = el('div', 'art');
  const cap = el('div', 'cap', data.text);
  card.append(art, cap);

  const useEmoji = () => {
    art.replaceChildren();
    card.style.background = card.style.color = '';
    if (data.emoji) { art.textContent = data.emoji; cap.hidden = !captions; }
    else { card.classList.add('plain'); cap.hidden = false; }
  };

  if (style === 'text') {
    card.classList.add('plain');
  } else if (style !== 'emoji') {
    // Any other style name is an image folder: img/<storyId>/<style>/
    const img = new Image();
    img.alt = '';
    img.draggable = false;
    img.onerror = useEmoji;            // no image file: fall back to emoji, then text
    img.src = 'img/' + story.id + '/' + style + '/' + (data.img || pad2(idx + 1) + '.png');
    art.append(img);
    cap.hidden = !captions;
    // Optional story.paper[style]: the image set's background colour. The card
    // takes it so the caption strip blends into the picture, in any theme.
    const paper = story.paper && story.paper[style];
    if (/^#[0-9a-f]{6}$/i.test(paper || '')) {
      const [r, g, b] = [1, 3, 5].map(i => parseInt(paper.substr(i, 2), 16));
      card.style.background = paper;
      card.style.color = (r * 299 + g * 587 + b * 114) / 1000 > 140 ? '#3a2f25' : '#efe6d6';
    }
  } else {
    useEmoji();
  }
  return card;
}

function startStory() {
  const story = stories.find(s => s.id === pick.storyId);
  const n = story.cards.length;
  const direction = story.reversible ? pick.direction : 'forward';
  const order = [...Array(n).keys()];
  if (direction === 'reverse') order.reverse();
  const pinned = story.reversible ? order[0] : null;

  S = {
    story, style: pick.style, direction, order, pinned,
    slots: Array(n).fill(null),
    tray: shuffledAwayFrom(order.filter(c => c !== pinned)),
    selected: null, locked: false, attempt: 1,
    run: ++runCount, t0: performance.now(),
    slotEls: [], cardEls: []
  };
  if (pinned != null) S.slots[0] = pinned;

  $('playTitle').textContent = story.title;
  const slotsEl = $('slots');
  slotsEl.replaceChildren();
  $('tray').replaceChildren();
  for (let i = 0; i < n; i++) {
    const slot = el('div', 'slot');
    slot.dataset.slot = i;
    slot.dataset.n = i === 0 && pinned != null ? '1 · Start' : i + 1;
    slot.classList.toggle('start', i === 0 && pinned != null);
    if (i !== 0 || pinned == null) {
      slot.tabIndex = 0;
      slot.setAttribute('role', 'button');
      slot.setAttribute('aria-label', 'Spot ' + (i + 1));
      slot.onclick = e => { if (!e.target.closest('.card')) tapSlot(i); };
      slot.onkeydown = e => { if (e.target === slot && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); tapSlot(i); } };
    }
    S.slotEls.push(slot);
    slotsEl.append(slot);
  }
  const captions = $('captions').checked;
  for (let i = 0; i < n; i++) {
    const card = buildCard(story, i, S.style, captions);
    if (i === pinned) { card.classList.add('pinned'); card.tabIndex = -1; }
    else wireCard(card, i);
    S.cardEls.push(card);
  }

  $('cue').value = 'independent';
  $('feedback').textContent = '';
  $('checkBtn').hidden = false;
  $('nextBtn').hidden = true;
  $('endBtn').hidden = true;
  render();
  show('play');
}

function render() {
  S.slotEls.forEach((slot, i) => {
    const c = S.slots[i];
    if (c != null) slot.append(S.cardEls[c]);
    slot.classList.toggle('filled', c != null);
  });
  for (const c of S.tray) $('tray').append(S.cardEls[c]);
  S.cardEls.forEach((card, i) => card.classList.toggle('selected', i === S.selected));
  $('play').classList.toggle('picking', S.selected != null);
  $('play').classList.toggle('locked', S.locked);
  $('checkBtn').disabled = S.locked || S.slots.includes(null);
}

// dest: a slot index, or 'tray'
function move(card, dest) {
  if (S.locked || card === S.pinned) return;
  const from = S.slots.indexOf(card);
  if (dest === 'tray') {
    if (from >= 0) { S.slots[from] = null; S.tray.push(card); }
  } else {
    const occupant = S.slots[dest];
    if (occupant === S.pinned && S.pinned != null) return;
    if (occupant !== card) {
      if (from >= 0) S.slots[from] = null;
      else S.tray = S.tray.filter(c => c !== card);
      S.slots[dest] = card;
      if (occupant != null) {
        if (from >= 0) S.slots[from] = occupant;   // swap
        else S.tray.push(occupant);
      }
    }
  }
  S.selected = null;
  render();
}

function tapCard(card) {
  if (S.locked || card === S.pinned) return;
  if (S.selected == null) S.selected = card;
  else if (S.selected === card) S.selected = null;
  else {
    const at = S.slots.indexOf(card);
    if (at >= 0) return move(S.selected, at);     // tap a placed card = swap into its spot
    S.selected = card;
  }
  render();
}

function tapSlot(i) {
  if (S.selected != null) move(S.selected, i);
}

function wireCard(card, idx) {
  let start = null, dragging = false;

  card.addEventListener('pointerdown', e => {
    if (S.locked || e.button > 0) return;
    start = { x: e.clientX, y: e.clientY, id: e.pointerId };
    dragging = false;
    try { card.setPointerCapture(e.pointerId); } catch {}
  });

  card.addEventListener('pointermove', e => {
    if (!start || e.pointerId !== start.id) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (!dragging && Math.hypot(dx, dy) > 8) {
      dragging = true;
      S.selected = null;
      render();
      card.classList.add('dragging');
    }
    if (dragging) card.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  });

  const finish = (e, cancelled) => {
    if (!start || e.pointerId !== start.id) return;
    const wasDrag = dragging;
    start = null; dragging = false;
    card.classList.remove('dragging');
    card.style.transform = '';
    if (cancelled) return;
    if (!wasDrag) return tapCard(idx);
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const dest = under && under.closest('.slot, #tray');
    if (dest) move(idx, dest.id === 'tray' ? 'tray' : Number(dest.dataset.slot));
  };
  card.addEventListener('pointerup', e => finish(e, false));
  card.addEventListener('pointercancel', e => finish(e, true));
  card.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tapCard(idx); }
  });
}

function check() {
  if (S.locked || S.slots.includes(null)) return;
  const misplaced = [];
  S.slots.forEach((c, i) => { if (c !== S.order[i]) misplaced.push(i + 1); });
  const correct = misplaced.length === 0;
  const modeled = !correct && S.attempt === 2;

  log.push({
    run: S.run,
    storyId: S.story.id,
    cardCount: S.story.cards.length,
    style: S.style,
    direction: S.direction,
    attemptNumber: S.attempt,
    correct,
    misplacedPositions: misplaced,
    placedOrder: S.slots.map(c => c + 1),   // card numbers (forward order, from 1) as the student left them
    cueLevel: $('cue').value,
    seconds: Math.round((performance.now() - S.t0) / 1000),
    modeled
  });

  S.selected = null;
  if (!correct && S.attempt === 1) {
    S.attempt = 2;
    S.t0 = performance.now();
    $('cue').value = 'independent';
    $('feedback').textContent = 'Try again.';
    render();
    return;
  }
  if (modeled) { S.slots = [...S.order]; S.tray = []; }
  S.locked = true;
  $('feedback').textContent = correct ? "That's the order." : 'Here is the order.';
  $('checkBtn').hidden = true;
  $('nextBtn').hidden = false;
  $('endBtn').hidden = false;
  render();
}

/* ---------- Summary ---------- */

function groupRuns(entries) {
  const runs = new Map();
  for (const a of entries) {
    if (!runs.has(a.run)) runs.set(a.run, []);
    runs.get(a.run).push(a);
  }
  const groups = new Map();
  for (const attempts of runs.values()) {
    const a = attempts[0];
    const key = [a.cardCount, a.style, a.direction].join('|');
    if (!groups.has(key)) groups.set(key, { k: a.cardCount, style: a.style, direction: a.direction, runs: [] });
    groups.get(key).runs.push(attempts);
  }
  return [...groups.values()];
}

function groupSentence(g) {
  const N = g.runs.length;
  const what = g.k + '-card ' + (N === 1 ? 'story' : 'stories') +
    ' (' + g.style + ' stimuli' + (g.direction === 'reverse' ? ', reverse order' : '') + ')';
  const all = g.runs.flat();
  const cues = Object.keys(CUES).filter(c => all.some(a => a.cueLevel === c));
  const first = g.runs.filter(r => r[0].correct).length;
  const bySecond = g.runs.filter(r => r.some(a => a.correct)).length;
  const modeled = g.runs.filter(r => r.some(a => a.modeled)).length;

  let s;
  if (cues.length === 1) {
    s = 'Sequenced ' + first + '/' + N + ' ' + what + ' correctly on first attempt, ' +
      bySecond + '/' + N + ' by second attempt, ' + CUES[cues[0]] + '.';
  } else {
    // More than one cue level: report each separately, per attempt.
    const perCue = n => {
      const as = g.runs.map(r => r[n]).filter(Boolean);
      return cues.filter(c => as.some(a => a.cueLevel === c)).map(c => {
        const sub = as.filter(a => a.cueLevel === c);
        return sub.filter(a => a.correct).length + '/' + sub.length + ' correct ' + CUES[c];
      }).join(', ');
    };
    const second = perCue(1);
    s = 'Sequenced ' + what + ': on first attempt, ' + perCue(0) + '; ' +
      (second ? 'on second attempt, ' + second + '; ' : '') +
      bySecond + '/' + N + ' correct by second attempt overall.';
  }
  if (modeled) s += ' Correct order modeled for ' + modeled + '/' + N + '.';
  return s;
}

function errorSentence(entries) {
  const wrong = entries.filter(a => !a.correct);
  if (!wrong.length) return 'No sequencing errors.';
  const M = wrong.length;
  const count = test => wrong.filter(a => a.misplacedPositions.some(p => test(p, a.cardCount))).length;
  const parts = [
    ['first', count(p => p === 1)],
    ['middle', count((p, k) => p > 1 && p < k)],
    ['last', count((p, k) => p === k)]
  ].filter(([, n]) => n).map(([name, n]) => name + ' events (' + n + '/' + M + ')');
  let s = 'Errors across ' + M + ' incorrect ' + (M === 1 ? 'attempt' : 'attempts') +
    ' involved ' + parts.join(', ') + '.';

  // Name the commonest pattern: exactly two wrong spots, side by side,
  // can only be two neighboring cards swapped.
  const where = { start: 0, middle: 0, end: 0 };
  for (const a of wrong) {
    const [p, q] = a.misplacedPositions;
    if (a.misplacedPositions.length !== 2 || q - p !== 1) continue;
    where[q === a.cardCount ? 'end' : p === 1 ? 'start' : 'middle']++;
  }
  const swaps = where.start + where.middle + where.end;
  if (swaps) {
    const label = { start: 'at the start', middle: 'in the middle', end: 'at the end' };
    const used = Object.keys(where).filter(k => where[k]);
    s += ' ' + swaps + '/' + M + (swaps === 1 ? ' was a swap' : ' were swaps') + ' of two neighboring events ' +
      (used.length === 1
        ? label[used[0]] + ' of the sequence.'
        : '(' + used.map(k => where[k] + ' ' + label[k]).join(', ') + ' of the sequence).');
  }
  return s;
}

function buildOLine(entries) {
  if (!entries.length) return 'No attempts logged.';
  return groupRuns(entries).map(groupSentence).join(' ') + ' ' + errorSentence(entries);
}

function buildRaw(entries) {
  const head = ['storyId', 'cardCount', 'style', 'direction', 'attemptNumber', 'correct',
    'misplacedPositions', 'placedOrder', 'cueLevel', 'seconds', 'modeled'];
  const rows = entries.map(a => [
    a.storyId, a.cardCount, a.style, a.direction, a.attemptNumber,
    a.correct ? 'yes' : 'no', a.misplacedPositions.join(',') || '-',
    a.placedOrder.join(','), a.cueLevel, a.seconds, a.modeled ? 'yes' : 'no'
  ]);
  return [head, ...rows].map(r => r.join('\t')).join('\n');
}

function showSummary() {
  $('oline').textContent = buildOLine(log);
  $('raw').textContent = buildRaw(log);
  show('summary');
}

async function copyText(text, btn) {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch {
    const ta = el('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.append(ta);
    ta.select();
    try { ok = document.execCommand('copy'); } catch {}
    ta.remove();
  }
  btn.dataset.label = btn.dataset.label || btn.textContent;
  btn.textContent = ok ? 'Copied' : 'Could not copy. Select the text instead.';
  setTimeout(() => { btn.textContent = btn.dataset.label; }, 1800);
}

/* ---------- Wiring ---------- */

function usable(s) {
  return s && s.id && Array.isArray(s.cards) && s.cards.length >= (s.reversible ? 3 : 2) &&
    Array.isArray(s.styles) && s.styles.length;
}

async function init() {
  let loaded = null;
  try {
    const r = await fetch('stories.json', { cache: 'no-cache' });
    if (r.ok) loaded = await r.json();
  } catch {}
  if (!Array.isArray(loaded)) {
    loaded = SEED;
    $('sourceNote').hidden = false;
    $('sourceNote').textContent = 'Using the built-in stories. Edits to stories.json show up when the page is served (GitHub Pages or a local server), not when opened straight from disk.';
  }
  stories = loaded.filter(usable);

  $('startBtn').onclick = startStory;
  $('checkBtn').onclick = check;
  $('nextBtn').onclick = () => { renderSetup(); show('setup'); };
  $('backBtn').onclick = () => { renderSetup(); show('setup'); };
  $('endBtn').onclick = showSummary;
  $('endFromSetup').onclick = showSummary;
  $('resumeBtn').onclick = () => { renderSetup(); show('setup'); };
  $('copyO').onclick = e => copyText($('oline').textContent, e.currentTarget);
  $('copyRaw').onclick = e => copyText($('raw').textContent, e.currentTarget);
  $('newSession').onclick = () => {
    if (!confirm('Clear this session\'s data and start over?')) return;
    log = []; runCount = 0;
    renderSetup(); show('setup');
  };
  $('tray').onclick = e => {
    if (S && S.selected != null && !e.target.closest('.card')) move(S.selected, 'tray');
  };

  const themes = ['auto', 'light', 'dark'];
  let theme = 0;
  const paintTheme = () => {
    if (theme) document.documentElement.dataset.theme = themes[theme];
    else delete document.documentElement.dataset.theme;
    $('themeBtn').textContent = 'Appearance: ' + ['match this device', 'light', 'dark'][theme];
  };
  $('themeBtn').onclick = () => { theme = (theme + 1) % themes.length; paintTheme(); };
  paintTheme();

  if (!stories.length) {
    $('storyList').textContent = 'No stories found in stories.json.';
    $('startBtn').disabled = true;
    return;
  }
  renderSetup();
}

init();
</script>
